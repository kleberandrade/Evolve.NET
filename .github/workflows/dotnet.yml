name: .NET validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Evolve.NET.sln --locked-mode
      - run: dotnet build Evolve.NET.sln -c Release --no-restore
      - run: dotnet test --solution Evolve.NET.sln -c Release --no-build --no-restore
      - run: dotnet run --project Evolve.NET.Samples/Evolve.NET.Sample.Math -c Release --no-build -- 10 200 math-results.tsv
      - run: dotnet run --project Evolve.NET.Samples/Evolve.NET.Sample.LevelGenerator -c Release --no-build -- 10 300 level-results.tsv
